name: Windows Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable:
    name: Build Portable ZIP
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      BUILD_DIR: build-win-release
      QT_VERSION_SPEC: 6.11
      QT_ARCH: win64_msvc2022_64
      QT_MODULES: qtshadertools
      QT_INSTALL_DIR: ${{ github.workspace }}\Qt
      AQTINSTALL_SOURCE: git+https://github.com/Holt59/aqtinstall.git#egg=aqtinstall

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Qt SDK
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_INSTALL_DIR }}
          key: windows-qt-${{ runner.os }}-${{ env.QT_VERSION_SPEC }}-${{ env.QT_ARCH }}-${{ env.QT_MODULES }}

      - name: Install Qt with aqt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$env:AQTINSTALL_SOURCE"
          python -m aqt version
          python -m aqt list-qt windows desktop --spec $env:QT_VERSION_SPEC
          python -m aqt install-qt windows desktop $env:QT_VERSION_SPEC $env:QT_ARCH --outputdir $env:QT_INSTALL_DIR --modules $env:QT_MODULES

      - name: Expose Qt tools
        shell: pwsh
        run: |
          $qtVersionDir = Get-ChildItem $env:QT_INSTALL_DIR -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $qtVersionDir) {
            throw "Qt installation directory not found under $env:QT_INSTALL_DIR"
          }
          $qtRootDir = Join-Path $qtVersionDir.FullName $env:QT_ARCH
          if (!(Test-Path $qtRootDir)) {
            throw "Qt root directory not found: $qtRootDir"
          }
          "$qtRootDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "QT_ROOT_DIR=$qtRootDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$qtRootDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt6_DIR=$qtRootDir\lib\cmake\Qt6" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\vcpkg\archives
            ${{ github.workspace }}\build-win-release\vcpkg_installed
          key: windows-portable-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'plugins/**/CMakeLists.txt') }}
          restore-keys: |
            windows-portable-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset vcpkg-manifest -B $env:BUILD_DIR -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

      - name: Build
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR --parallel 4

      - name: Create portable package
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR\QMeshLab.exe"
          if (!(Test-Path $exePath)) {
            $exePath = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR\Release\QMeshLab.exe"
          }
          if (!(Test-Path $exePath)) {
            throw "QMeshLab.exe not found in build output"
          }

          $distRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $portableDir = Join-Path $distRoot "QMeshLab-portable-win64"
          Remove-Item -Recurse -Force $portableDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          Copy-Item $exePath $portableDir

          & windeployqt --release --compiler-runtime (Join-Path $portableDir "QMeshLab.exe")

          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item (Join-Path $vcpkgBin "*.dll") $portableDir -Force -ErrorAction SilentlyContinue
          }

          $zipPath = Join-Path $distRoot "QMeshLab-portable-win64.zip"
          Remove-Item -Force $zipPath -ErrorAction SilentlyContinue
          Compress-Archive -Path $portableDir -DestinationPath $zipPath
          Get-ChildItem $distRoot

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmeshlab-windows-portable
          path: ${{ github.workspace }}/dist/QMeshLab-portable-win64.zip
          if-no-files-found: error
