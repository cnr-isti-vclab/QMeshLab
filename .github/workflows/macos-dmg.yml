name: macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build Unsigned DMG
    # Apple Silicon only: macOS 26 is Apple's last Intel release. Pinned rather
    # than macos-latest because, with no explicit CMAKE_OSX_DEPLOYMENT_TARGET,
    # the runner's OS version becomes the dmg's minimum supported macOS.
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      APP_NAME: QMeshLab
      BUILD_DIR: build-release
      QT_VERSION: 6.11.*
      QT_ARCH: clang_64
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install macOS build dependencies
        run: |
          # GMP is built from source by vcpkg on macOS and its autoreconf step
          # needs the complete GNU autotools toolchain.
          brew install \
            ninja \
            libomp \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Expose build tools
        run: |
          echo "$(brew --prefix ninja)/bin" >> "$GITHUB_PATH"
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix libomp)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix libomp)/lib" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtshadertools
          cache: true
          cache-key-prefix: qmeshlab-qt-macos

      - name: Expose Qt tools
        run: |
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR;$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Cache vcpkg artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/vcpkg/archives
            ${{ github.workspace }}/build-release/vcpkg_installed
          # runner.arch is part of the key: runner.os is "macOS" for both Intel
          # and Apple Silicon, so without it the x64 cache is restored onto an
          # arm64 runner, where none of it is usable.
          key: macos-dmg-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'plugins/**/CMakeLists.txt') }}
          restore-keys: |
            macos-dmg-vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          VCPKG_BASELINE="$(python3 - <<'PY'
          import json
          with open("vcpkg.json", "r", encoding="utf-8") as f:
              print(json.load(f)["builtin-baseline"])
          PY
          )"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          cmake --preset vcpkg-manifest \
            -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DOpenMP_ROOT="$OpenMP_ROOT" \
            -DOpenMP_CXX_INCLUDE_DIR="$OpenMP_ROOT/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="$OpenMP_ROOT/lib/libomp.dylib" \
            -DCMAKE_MAKE_PROGRAM="$(brew --prefix ninja)/bin/ninja"

      - name: Build
        run: |
          cmake --build "$BUILD_DIR" -j"$(sysctl -n hw.ncpu)"

      - name: Package unsigned DMG
        run: |
          ./scripts/package-macos-dmg.sh --no-build --build-dir "$BUILD_DIR"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: qmeshlab-macos-dmg
          path: ${{ github.workspace }}/build-release/*.dmg
          if-no-files-found: error
