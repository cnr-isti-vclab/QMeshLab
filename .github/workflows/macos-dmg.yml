name: macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build Unsigned DMG
    runs-on: macos-15-intel
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      APP_NAME: QMeshLab
      BUILD_DIR: build-release
      QT_VERSION: 6.11.*
      QT_ARCH: clang_64
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install macOS build dependencies
        run: |
          brew install ninja libomp

      - name: Expose build tools
        run: |
          echo "$(brew --prefix ninja)/bin" >> "$GITHUB_PATH"
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix libomp)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix libomp)/lib" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtshadertools
          cache: true
          cache-key-prefix: qmeshlab-qt-macos

      - name: Expose Qt tools
        run: |
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR;$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/vcpkg/archives
            ${{ github.workspace }}/build-release/vcpkg_installed
          key: macos-dmg-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'plugins/**/CMakeLists.txt') }}
          restore-keys: |
            macos-dmg-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          VCPKG_BASELINE="$(python3 - <<'PY'
          import json
          with open("vcpkg.json", "r", encoding="utf-8") as f:
              print(json.load(f)["builtin-baseline"])
          PY
          )"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          cmake --preset vcpkg-manifest \
            -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DOpenMP_ROOT="$OpenMP_ROOT" \
            -DOpenMP_CXX_INCLUDE_DIR="$OpenMP_ROOT/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="$OpenMP_ROOT/lib/libomp.dylib" \
            -DCMAKE_MAKE_PROGRAM="$(brew --prefix ninja)/bin/ninja"

      - name: Build
        run: |
          cmake --build "$BUILD_DIR" -j3

      - name: Package unsigned DMG
        run: |
          cd "$BUILD_DIR"
          macdeployqt "$APP_NAME.app" -always-overwrite
          APP_BIN="$APP_NAME.app/Contents/MacOS/$APP_NAME"
          APP_FW="$APP_NAME.app/Contents/Frameworks"
          OMP_LINK_PATH="$(otool -L "$APP_BIN" | awk '/libomp\.dylib/ {print $1; exit}')"
          if [ -n "$OMP_LINK_PATH" ]; then
            mkdir -p "$APP_FW"
            cp -f "$OpenMP_ROOT/lib/libomp.dylib" "$APP_FW/"
            install_name_tool -id "@rpath/libomp.dylib" "$APP_FW/libomp.dylib"
            install_name_tool -change "$OMP_LINK_PATH" "@executable_path/../Frameworks/libomp.dylib" "$APP_BIN"
            otool -L "$APP_BIN"
          fi
          macdeployqt "$APP_NAME.app" -always-overwrite -dmg
          ARCH="$(uname -m)"
          DMG_NAME="${APP_NAME}-macos-${ARCH}-unsigned.dmg"
          rm -f "$DMG_NAME"
          mv "${APP_NAME}.dmg" "$DMG_NAME"
          ls -lah "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmeshlab-macos-dmg
          path: ${{ github.workspace }}/build-release/*.dmg
          if-no-files-found: error
