name: macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build Unsigned DMG
    runs-on: macos-15-intel
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      APP_NAME: QMeshLab
      BUILD_DIR: build-release
      QT_VERSION: 6.11.*
      QT_ARCH: clang_64
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install macOS build dependencies
        run: |
          brew install ninja libomp

      - name: Expose build tools
        run: |
          echo "$(brew --prefix ninja)/bin" >> "$GITHUB_PATH"
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix libomp)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix libomp)/lib" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtshadertools
          cache: true
          cache-key-prefix: qmeshlab-qt-macos

      - name: Expose Qt tools
        run: |
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR;$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/vcpkg/archives
            ${{ github.workspace }}/build-release/vcpkg_installed
          key: macos-dmg-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'plugins/**/CMakeLists.txt') }}
          restore-keys: |
            macos-dmg-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          VCPKG_BASELINE="$(python3 - <<'PY'
          import json
          with open("vcpkg.json", "r", encoding="utf-8") as f:
              print(json.load(f)["builtin-baseline"])
          PY
          )"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          cmake --preset vcpkg-manifest \
            -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DOpenMP_ROOT="$OpenMP_ROOT" \
            -DOpenMP_CXX_INCLUDE_DIR="$OpenMP_ROOT/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="$OpenMP_ROOT/lib/libomp.dylib" \
            -DCMAKE_MAKE_PROGRAM="$(brew --prefix ninja)/bin/ninja"

      - name: Build
        run: |
          cmake --build "$BUILD_DIR" -j3

      - name: Package unsigned DMG
        run: |
          cd "$BUILD_DIR"
          APP_BUNDLE="$(find . -maxdepth 3 -type d -name "$APP_NAME.app" -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "Could not find $APP_NAME.app under $BUILD_DIR"
            find . -maxdepth 3 \( -type d -name "*.app" -o -type f -name "$APP_NAME" \)
            exit 1
          fi
          macdeployqt "$APP_BUNDLE" -always-overwrite
          APP_BIN="$APP_BUNDLE/Contents/MacOS/$APP_NAME"
          APP_FW="$APP_BUNDLE/Contents/Frameworks"
          APP_ICON="$(find "$APP_BUNDLE/Contents/Resources" -maxdepth 1 -type f -name "*.icns" -print -quit)"
          OMP_LINK_PATH="$(otool -L "$APP_BIN" | awk '/libomp\.dylib/ {print $1; exit}')"
          if [ -n "$OMP_LINK_PATH" ]; then
            mkdir -p "$APP_FW"
            cp -f "$OpenMP_ROOT/lib/libomp.dylib" "$APP_FW/"
            install_name_tool -id "@rpath/libomp.dylib" "$APP_FW/libomp.dylib"
            install_name_tool -change "$OMP_LINK_PATH" "@executable_path/../Frameworks/libomp.dylib" "$APP_BIN"
            otool -L "$APP_BIN"
          fi
          macdeployqt "$APP_BUNDLE" -always-overwrite -dmg
          ARCH="$(uname -m)"
          DMG_NAME="${APP_NAME}-macos-${ARCH}-unsigned.dmg"
          rm -f "$DMG_NAME"
          GENERATED_DMG="$(find . -maxdepth 3 -type f -name "${APP_NAME}.dmg" -print -quit)"
          if [ -z "$GENERATED_DMG" ]; then
            echo "macdeployqt did not produce ${APP_NAME}.dmg"
            find . -maxdepth 3 -type f -name "*.dmg"
            exit 1
          fi
          if [ -n "$APP_ICON" ] && xcrun -f SetFile >/dev/null 2>&1; then
            RW_DMG_BASE="${APP_NAME}-rw"
            RW_DMG_PATH="${RW_DMG_BASE}.dmg"
            FINAL_DMG_BASE="${APP_NAME}-icon"
            FINAL_DMG_PATH="${FINAL_DMG_BASE}.dmg"
            MOUNT_POINT="$(mktemp -d "/tmp/${APP_NAME}.XXXXXX")"
            rm -f "$RW_DMG_PATH" "$FINAL_DMG_PATH"
            hdiutil convert "$GENERATED_DMG" -format UDRW -o "$RW_DMG_BASE"
            DEVICE_NAME="$(hdiutil attach "$RW_DMG_PATH" -mountpoint "$MOUNT_POINT" -nobrowse -readwrite | awk -v mp="$MOUNT_POINT" '$NF == mp {print $1; exit}')"
            if [ -n "$DEVICE_NAME" ]; then
              cp -f "$APP_ICON" "$MOUNT_POINT/.VolumeIcon.icns"
              xcrun SetFile -a C "$MOUNT_POINT"
              xcrun SetFile -a V "$MOUNT_POINT/.VolumeIcon.icns"
              sync
              hdiutil detach "$DEVICE_NAME"
              hdiutil convert "$RW_DMG_PATH" -format UDZO -imagekey zlib-level=9 -o "$FINAL_DMG_BASE"
              rm -f "$GENERATED_DMG" "$RW_DMG_PATH"
              GENERATED_DMG="$FINAL_DMG_PATH"
            else
              echo "Could not determine mounted dmg device; leaving default dmg icon"
              hdiutil detach "$MOUNT_POINT" || true
            fi
            rmdir "$MOUNT_POINT" || true
          fi
          mv "$GENERATED_DMG" "$DMG_NAME"
          ls -lah "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmeshlab-macos-dmg
          path: ${{ github.workspace }}/build-release/*.dmg
          if-no-files-found: error
